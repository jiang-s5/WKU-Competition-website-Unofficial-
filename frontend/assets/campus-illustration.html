      bottom: 18px;

      border: 1px solid rgba(44, 75, 112, 0.08);
    }

    .glow {
      position: absolute;
      right: 40px;
      bottom: 42px;
      width: 420px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(114, 184, 240, 0.22), rgba(114, 184, 240, 0));
      filter: blur(8px);
    }

    svg {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 610px;
      height: 360px;
    }
  </style>
