<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Build With AI Poster v3</title>
  <style>
    :root {
      --bg: #f5f4ef;
      --paper: #fffdf9;
      --ink: #222325;
      --line: #2f3136;
      --blue: #4f7fe0;
      --blue-deep: #25558f;
      --blue-soft: #cceefe;
      --sky: #72b5ea;
      --orange: #ffb20d;
      --orange-soft: #ffea9f;
      --shadow: 0 16px 34px rgba(40, 69, 112, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 1600px;
      height: 1000px;
      overflow: hidden;
      background: var(--bg);
      font-family: "Avenir Next", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
    }

    body {
      position: relative;
    }

    .poster {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 18%, rgba(114, 181, 234, 0.08), transparent 18%),
        radial-gradient(circle at 82% 72%, rgba(79, 127, 224, 0.08), transparent 18%),
        linear-gradient(180deg, #f7f6f2 0%, #f4f3ee 100%);
    }

    .title-group {
      position: absolute;
      left: 100px;
      top: 118px;
      width: 700px;
      height: 650px;
    }

    .top-pill,
    .bottom-pill {
      position: absolute;
      border: 4px solid var(--line);
      border-radius: 999px;
      background: var(--orange);
      box-shadow: var(--shadow);
    }

    .top-pill {
      left: 20px;
      top: 0;
      width: 360px;
      height: 58px;
    }

    .grid-chip {
      position: absolute;
      left: 392px;
      top: -20px;
      width: 212px;
      height: 120px;
      padding: 18px 22px;
      border: 4px solid var(--line);
      border-radius: 32px;
      background: var(--blue-soft);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      box-shadow: var(--shadow);
    }

    .grid-chip span {
      border-radius: 50%;
      border: 4px solid var(--line);
      background: linear-gradient(180deg, #4c7ce1 0%, #74b9f2 100%);
    }

    .title-card {
      position: absolute;
      left: 20px;
      top: 56px;
      width: 650px;
      height: 470px;
      border: 4px solid var(--line);
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 20px 40px rgba(37, 62, 96, 0.08);
      padding: 68px 58px 46px;
    }

    .title-card h1 {
      margin: 0;
      font-size: 106px;
      line-height: 0.94;
      letter-spacing: -0.07em;
      font-weight: 900;
    }

    .title-card h1 span {
      display: block;
    }

    .spark-badge {
      position: absolute;
      right: 92px;
      top: 86px;
      width: 108px;
      height: 108px;
    }

    .tag-chip,
    .year-chip {
      position: absolute;
      bottom: 116px;
      height: 112px;
      border: 4px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }

    .tag-chip {
      left: 128px;
      width: 218px;
      background: var(--orange-soft);
      display: grid;
      place-items: center;
    }

    .year-chip {
      left: 345px;
      width: 230px;
      background: rgba(255, 255, 255, 0.98);
      display: grid;
      place-items: center;
      font-size: 54px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .dot {
      position: absolute;
      left: 560px;
      bottom: 136px;
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: 4px solid var(--line);
      background: var(--sky);
      box-shadow: var(--shadow);
    }

    .bottom-pill {
      left: 350px;
      bottom: 0;
      width: 390px;
      height: 54px;
    }

    .gdg-mark {
      position: relative;
      width: 100px;
      height: 64px;
    }

    .gdg-mark span {
      position: absolute;
      width: 48px;
      height: 24px;
      border-radius: 999px;
      border: 4px solid var(--line);
    }

    .gdg-mark span:nth-child(1) {
      left: 0;
      top: 0;
      background: #ef5548;
      transform: rotate(-34deg);
    }

    .gdg-mark span:nth-child(2) {
      right: 0;
      top: 0;
      background: #49b360;
      transform: rotate(34deg);
    }

    .gdg-mark span:nth-child(3) {
      left: 6px;
      bottom: 0;
      background: #3f78ef;
      transform: rotate(34deg);
    }

    .gdg-mark span:nth-child(4) {
      right: 6px;
      bottom: 0;
      background: #ffb407;
      transform: rotate(-34deg);
    }

    .arrow {
      position: absolute;
      left: 710px;
      top: 232px;
      width: 170px;
      height: 132px;
      background: linear-gradient(180deg, #5b89e8 0%, #4879df 100%);
      clip-path: polygon(0 18%, 52% 18%, 52% 0, 100% 50%, 52% 100%, 52% 82%, 0 82%);
      filter: drop-shadow(0 12px 16px rgba(72, 121, 223, 0.2));
    }

    .info-group {
      position: absolute;
      left: 1030px;
      top: 210px;
      width: 520px;
    }

    .rule {
      height: 4px;
      background: #2f3136;
    }

    .info-block {
      padding: 56px 0 52px;
    }

    .info-row + .info-row {
      margin-top: 48px;
    }

    .info-row {
      display: flex;
      align-items: baseline;
      gap: 14px;
      flex-wrap: wrap;
      color: #111214;
    }

    .info-label {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .info-value {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .date-row .info-label,
    .date-row .info-value {
      font-size: 42px;
    }

    .campus {
      position: absolute;
      right: 0;
      bottom: 42px;
      width: 620px;
      height: 420px;
    }

    .logo-row {
      position: absolute;
      left: 78px;
      right: 720px;
      bottom: 34px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }

    .logo {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
    }

    .logo.csmt {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #284567;
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      box-shadow: 0 12px 24px rgba(40, 69, 103, 0.14);
      text-align: center;
      padding-top: 16px;
    }

    .logo.csmt strong {
      display: block;
      font-size: 38px;
      line-height: 1;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .logo.csmt small {
      display: block;
      margin-top: 8px;
      width: 82px;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 8px;
      line-height: 1.35;
      font-weight: 700;
      opacity: 0.86;
    }

    .logo.gdg {
      width: 132px;
      height: 92px;
    }

    .logo.gdg .gdg-mark {
      transform: scale(1.02);
    }

    .logo.wrsia {
      width: 126px;
      height: 126px;
      border-radius: 50%;
      border: 2px solid #5a81bd;
      color: #2c5da0;
      background: rgba(255, 255, 255, 0.8);
      text-align: center;
      padding-top: 38px;
    }

    .logo.wrsia strong {
      display: block;
      font-size: 28px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    .logo.wrsia small {
      display: block;
      margin-top: 8px;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.08em;
      opacity: 0.72;
    }

    .logo.whale svg {
      width: 120px;
      height: 96px;
    }

    .logo.ai-club {
      width: 142px;
      height: 118px;
      color: #262729;
    }

    .logo.ai-club svg {
      width: 72px;
      height: 72px;
    }

    .logo.ai-club strong {
      display: block;
      margin-top: 4px;
      font-size: 30px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.02em;
      font-family: "Segoe UI Black", "Avenir Next", sans-serif;
    }
  </style>
</head>
