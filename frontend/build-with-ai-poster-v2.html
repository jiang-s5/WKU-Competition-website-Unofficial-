<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Build With AI Wenzhou Poster v2</title>
  <style>
    :root {
      --paper: #f7f6f2;
      --paper-deep: #eef1f5;
      --ink: #1d1d1f;
      --line: #2b2b2e;
      --blue: #4f7fda;
      --blue-deep: #2f5f9f;
      --blue-soft: #cdeeff;
      --orange: #ffaf0f;
      --orange-soft: #ffe89f;
      --sky: #73b8f0;
      --shadow: 0 18px 36px rgba(40, 72, 122, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 1600px;
      height: 1000px;
      overflow: hidden;
      background: linear-gradient(180deg, var(--paper) 0%, var(--paper-deep) 100%);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      position: relative;
    }

    .poster {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 10% 18%, rgba(121, 170, 255, 0.08), transparent 20%),
        radial-gradient(circle at 78% 76%, rgba(79, 127, 218, 0.08), transparent 24%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.74), rgba(241, 244, 248, 0.96));
    }

    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.28;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(31, 63, 110, 0.02) 0 1px, transparent 1px),
        radial-gradient(circle at 70% 60%, rgba(31, 63, 110, 0.02) 0 1px, transparent 1px);
      background-size: 22px 22px, 28px 28px;
      pointer-events: none;
    }

    .campus-lockup {
      position: absolute;
      top: 82px;
      right: 110px;
      display: flex;
      align-items: center;
      gap: 16px;
      color: #294565;
    }

    .seal {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid rgba(41, 69, 101, 0.8);
      display: grid;
      place-items: center;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.12em;
      background: rgba(255, 255, 255, 0.65);
    }

    .campus-lockup strong,
    .campus-lockup small {
      display: block;
    }

    .campus-lockup strong {
      font-size: 27px;
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .campus-lockup small {
      margin-top: 4px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: rgba(41, 69, 101, 0.72);
    }

    .title-cluster {
      position: absolute;
      left: 92px;
      top: 120px;
      width: 720px;
      height: 660px;
    }

    .top-pill,
    .bottom-pill {
      position: absolute;
      border: 4px solid var(--line);
      border-radius: 999px;
      background: var(--orange);
    }

    .top-pill {
      top: 0;
      left: 14px;
      width: 388px;
      height: 62px;
      box-shadow: var(--shadow);
    }

    .bottom-pill {
      left: 394px;
      bottom: 0;
      width: 410px;
      height: 58px;
    }

    .grid-chip {
      position: absolute;
      top: -28px;
      left: 426px;
      width: 246px;
      height: 136px;
      border: 4px solid var(--line);
      border-radius: 34px;
      background: var(--blue-soft);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      padding: 20px 24px;
    }

    .grid-chip span {
      border-radius: 50%;
      border: 4px solid var(--line);
      background: linear-gradient(180deg, #5787ea 0%, #73b8f0 100%);
    }

    .title-card {
      position: absolute;
      inset: 58px 24px 114px 46px;
      border: 4px solid var(--line);
      border-radius: 44px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 20px 46px rgba(43, 43, 46, 0.06);
      padding: 76px 70px 68px;
    }

    .title-main {
      position: relative;
      z-index: 2;
      font-size: 104px;
      line-height: 0.92;
      font-weight: 900;
      letter-spacing: -0.06em;
      color: var(--ink);
    }

    .title-main span {
      display: block;
    }

    .spark-badge {
      position: absolute;
      right: 96px;
      top: 94px;
      width: 118px;
      height: 118px;
    }

    .mini-chip,
    .year-chip {
      position: absolute;
      border: 4px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }

    .mini-chip {
      left: 164px;
      bottom: 112px;
      width: 226px;
      height: 126px;
      background: var(--orange-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .gdg-mark {
      position: relative;
      width: 102px;
      height: 64px;
    }

    .gdg-mark span {
      position: absolute;
      width: 48px;
      height: 24px;
      border-radius: 999px;
      border: 4px solid var(--line);
    }

    .gdg-mark span:nth-child(1) {
      left: 0;
      top: 0;
      background: #ef5548;
      transform: rotate(-34deg);
    }

    .gdg-mark span:nth-child(2) {
      right: 0;
      top: 0;
      background: #49b360;
      transform: rotate(34deg);
    }

    .gdg-mark span:nth-child(3) {
      left: 6px;
      bottom: 0;
      background: #3f78ef;
      transform: rotate(34deg);
    }

    .gdg-mark span:nth-child(4) {
      right: 6px;
      bottom: 0;
      background: #ffb407;
      transform: rotate(-34deg);
    }

    .year-chip {
      left: 390px;
      bottom: 112px;
      width: 250px;
      height: 126px;
      background: rgba(255, 255, 255, 0.94);
      display: grid;
      place-items: center;
      font-size: 56px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .accent-dot {
      position: absolute;
      right: 46px;
      bottom: 136px;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      border: 4px solid var(--line);
      background: var(--sky);
      box-shadow: var(--shadow);
    }

    .connector-arrow {
      position: absolute;
      left: 752px;
      top: 268px;
      width: 164px;
      height: 128px;
      background: linear-gradient(180deg, #5b87e7 0%, #4270d5 100%);
      clip-path: polygon(0 18%, 52% 18%, 52% 0, 100% 50%, 52% 100%, 52% 82%, 0 82%);
      filter: drop-shadow(0 14px 16px rgba(66, 112, 213, 0.25));
    }

    .info-panel {
      position: absolute;
      top: 190px;
      right: 108px;
      width: 600px;
      color: var(--ink);
    }

    .eyebrow {
      margin: 0 0 18px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.18em;
      color: var(--blue-deep);
    }

    .info-frame {
      position: relative;
      padding: 56px 0 46px;
    }

    .info-frame::before,
    .info-frame::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--line);
    }

    .info-frame::before {
      top: 0;
    }

    .info-frame::after {
      bottom: 0;
    }

    .info-row + .info-row {
      margin-top: 38px;
    }

    .info-label {
      display: block;
      margin-bottom: 8px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: rgba(29, 29, 31, 0.7);
    }

    .info-value {
      display: block;
      font-size: 60px;
      line-height: 1.04;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .illustration-wrap {
      position: absolute;
      right: 4px;
      bottom: 108px;
      width: 670px;
      height: 438px;
    }

    .illustration-glow {
      position: absolute;
      inset: 70px 24px 16px 110px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(114, 184, 240, 0.22), rgba(114, 184, 240, 0));
      filter: blur(8px);
    }

    .organizer-strip {
      position: absolute;
      left: 70px;
      right: 70px;
      bottom: 32px;
      height: 114px;
      border-radius: 28px;
      border: 2px solid rgba(53, 80, 116, 0.16);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 18px 36px rgba(57, 86, 123, 0.08);
      display: grid;
      grid-template-columns: 130px repeat(5, 1fr);
      align-items: center;
      gap: 12px;
      padding: 0 26px;
    }

    .strip-label {
      font-size: 20px;
      line-height: 1.1;
      font-weight: 800;
      color: rgba(45, 72, 108, 0.68);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .logo-item {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .logo-copy {
      min-width: 0;
      font-size: 13px;
      line-height: 1.3;
      color: #27415d;
      font-weight: 700;
    }

    .logo-copy span,
    .logo-copy small {
      display: block;
    }

    .logo-copy small {
      margin-top: 3px;
      font-size: 11px;
      color: rgba(39, 65, 93, 0.62);
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .mark-circle,
    .mark-square,
    .mark-whale,
    .mark-gear {
      flex: none;
      display: grid;
      place-items: center;
    }

    .mark-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid rgba(33, 54, 83, 0.18);
      background: linear-gradient(180deg, #f7fafc 0%, #e8eff7 100%);
      color: #27415d;
      font-weight: 800;
      font-size: 16px;
    }

    .mark-circle.dark {
      background: #294565;
      color: #fff;
      border-color: rgba(255, 255, 255, 0.24);
      font-family: Georgia, "Times New Roman", serif;
      letter-spacing: 0.03em;
    }

    .mark-square {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      border: 2px solid rgba(33, 54, 83, 0.14);
      background: #fff7d1;
    }

    .mark-square .gdg-mark {
      transform: scale(0.52);
    }

    .mark-whale svg,
    .mark-gear svg {
      width: 58px;
      height: 58px;
    }
  </style>
</head>
<body>
  <main class="poster">
    <div class="grain"></div>

    <header class="campus-lockup">
      <div class="seal">WKU</div>
      <div>
        <strong>温州肯恩大学</strong>
        <small>WENZHOU-KEAN UNIVERSITY</small>
      </div>
    </header>

    <section class="title-cluster">
      <div class="top-pill"></div>

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <article class="title-card">
        <div class="title-main">
          <span>Build</span>
          <span>with AI</span>

          <span></span>

          <span></span>

      </div>

      <div class="year-chip">2026</div>
      <div class="accent-dot"></div>
      <div class="bottom-pill"></div>
    </section>

    <div class="connector-arrow" aria-hidden="true"></div>

    <section class="info-panel">
      <p class="eyebrow">BUILD WITH AI · WENZHOU EDITION</p>

      <div class="info-frame">
        <div class="info-row">
          <span class="info-label">Location</span>
          <span class="info-value">Wenzhou-Kean University</span>
        </div>

        <div class="info-row">
          <span class="info-label">Date</span>
          <span class="info-value">April 26, 2026</span>
        </div>
      </div>
    </section>

    <section class="organizer-strip">
      <div class="strip-label">Organized by</div>

      <div class="logo-item">
        <div class="mark-circle dark">CSMT</div>
        <div class="logo-copy">
          <span>Science &amp; Math College</span>
          <small>WKU</small>
        </div>
      </div>

      <div class="logo-item">
        <div class="mark-square">
          <div class="gdg-mark" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
        <div class="logo-copy">
          <span>Google Developer Groups</span>
          <small>Wenzhou</small>
        </div>
      </div>

      <div class="logo-item">
        <div class="mark-circle">WRSIA</div>
        <div class="logo-copy">
          <span>WRSIA</span>
          <small>AI Committee</small>
        </div>
      </div>

      <div class="logo-item">
        <div class="mark-whale">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

          <small>Student Community</small>

  </main>
</body>
</html>
