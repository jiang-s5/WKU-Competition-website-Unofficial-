<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Build With AI Poster v4</title>
  <style>
    :root {
      --paper: #f5f3ed;
      --paper-soft: #fcfbf7;
      --ink: #1f2023;
      --line: #2c2e33;
      --blue: #4f7fe0;
      --blue-deep: #28568f;
      --blue-soft: #cae8fb;
      --blue-cloud: #d9efff;
      --sky: #72b5ea;
      --orange: #ffb20d;
      --orange-soft: #ffe9a0;
      --shadow: 0 22px 48px rgba(47, 72, 106, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 1600px;
      height: 1000px;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      position: relative;
    }

    .poster {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 10% 16%, rgba(114, 181, 234, 0.12), transparent 20%),
        radial-gradient(circle at 84% 74%, rgba(79, 127, 224, 0.12), transparent 22%),
        linear-gradient(180deg, #f7f5f0 0%, #f2f1eb 100%);
    }

    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.24;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(38, 65, 104, 0.035) 0 1px, transparent 1px),
        radial-gradient(circle at 70% 60%, rgba(38, 65, 104, 0.03) 0 1px, transparent 1px);
      background-size: 26px 26px, 32px 32px;
    }

    .hero-band {
      position: absolute;
      left: 54px;
      top: 56px;
      right: 54px;
      height: 742px;
      border-radius: 40px;
      border: 2px solid rgba(44, 46, 51, 0.1);
      overflow: hidden;
      box-shadow: 0 26px 56px rgba(56, 82, 122, 0.1);
      background:
        radial-gradient(circle at 84% 66%, rgba(114, 181, 234, 0.18), transparent 24%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.92) 0%, rgba(252, 250, 246, 0.95) 48%, rgba(242, 248, 253, 0.9) 100%);
    }

    .hero-band::before {
      content: "";
      position: absolute;
      inset: 28px;
      border-radius: 30px;
      border: 1px solid rgba(44, 46, 51, 0.06);
      pointer-events: none;
    }

    .hero-band::after {
      content: "";
      position: absolute;
      right: -70px;
      bottom: -40px;
      width: 560px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(96, 150, 219, 0.26), rgba(96, 150, 219, 0));
      filter: blur(10px);
      pointer-events: none;
    }

    .campus-lockup {
      position: absolute;
      top: 42px;
      right: 56px;
      display: flex;
      align-items: center;
      gap: 16px;
      color: #2c4b70;
      z-index: 3;
    }

    .seal {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid rgba(44, 75, 112, 0.8);
      display: grid;
      place-items: center;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.12em;
      background: rgba(255, 255, 255, 0.74);
    }

    .campus-copy strong,
    .campus-copy small {
      display: block;
    }

    .campus-copy strong {
      font-size: 28px;
      line-height: 1.04;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .campus-copy small {
      margin-top: 5px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.16em;
      color: rgba(44, 75, 112, 0.68);
    }

    .title-cluster {
      position: absolute;
      left: 42px;
      top: 92px;
      width: 664px;
      height: 594px;
      z-index: 2;
    }

    .top-pill,
    .bottom-pill {
      position: absolute;
      border: 4px solid var(--line);
      border-radius: 999px;
      background: var(--orange);
      box-shadow: var(--shadow);
    }

    .top-pill {
      top: 0;
      left: 18px;
      width: 388px;
      height: 60px;
    }

    .bottom-pill {
      left: 332px;
      bottom: 0;
      width: 324px;
      height: 52px;
    }

    .grid-chip {
      position: absolute;
      top: -20px;
      left: 432px;
      width: 204px;
      height: 116px;
      border: 4px solid var(--line);
      border-radius: 30px;
      background: var(--blue-soft);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 16px 20px;
    }

    .grid-chip span {
      border-radius: 50%;
      border: 4px solid var(--line);
      background: linear-gradient(180deg, #5787ea 0%, #74b9f2 100%);
    }

    .title-card {
      position: absolute;
      inset: 52px 20px 104px 36px;
      border: 4px solid var(--line);
      border-radius: 42px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 22px 44px rgba(43, 43, 46, 0.07);
      padding: 78px 56px 60px;
    }

    .title-main {
      position: relative;
      z-index: 2;
      font-size: 100px;
      line-height: 0.92;
      font-weight: 900;
      letter-spacing: -0.065em;
      color: var(--ink);
      font-family: "Arial Black", "Avenir Next", "Segoe UI", sans-serif;
    }

    .title-main span {
      display: block;
    }

    .spark-badge {
      position: absolute;
      right: 84px;
      top: 88px;
      width: 110px;
      height: 110px;
    }

    .mini-chip,
    .year-chip {
      position: absolute;
      border: 4px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }

    .mini-chip {
      left: 146px;
      bottom: 104px;
      width: 202px;
      height: 112px;
      background: var(--orange-soft);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .year-chip {
      left: 340px;
      bottom: 104px;
      width: 212px;
      height: 112px;
      background: rgba(255, 255, 255, 0.95);
      display: grid;
      place-items: center;
      font-size: 54px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .accent-dot {
      position: absolute;
      right: 44px;
      bottom: 122px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 4px solid var(--line);
      background: var(--sky);
      box-shadow: var(--shadow);
    }

    .gdg-mark {
      position: relative;
      width: 96px;
      height: 62px;
    }

    .gdg-mark span {
      position: absolute;
      width: 46px;
      height: 24px;
      border-radius: 999px;
      border: 4px solid var(--line);
    }

    .gdg-mark span:nth-child(1) {
      left: 0;
      top: 0;
      background: #ef5548;
      transform: rotate(-34deg);
    }

    .gdg-mark span:nth-child(2) {
      right: 0;
      top: 0;
      background: #49b360;
      transform: rotate(34deg);
    }

    .gdg-mark span:nth-child(3) {
      left: 6px;
      bottom: 0;
      background: #3f78ef;
      transform: rotate(34deg);
    }

    .gdg-mark span:nth-child(4) {
      right: 6px;
      bottom: 0;
      background: #ffb407;
      transform: rotate(-34deg);
    }

    .info-panel {
      position: absolute;
      right: 108px;
      top: 150px;
      width: 548px;
      z-index: 3;
    }

    .eyebrow {
      margin: 0 0 20px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.22em;
      color: var(--blue-deep);
    }

    .info-frame {
      position: relative;
      padding: 38px 0 34px;
    }

    .info-frame::before,
    .info-frame::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--line);
    }

    .info-frame::before {
      top: 0;
    }

    .info-frame::after {
      bottom: 0;
    }

    .info-row + .info-row {
      margin-top: 34px;
    }

    .info-label {
      display: block;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(31, 32, 35, 0.54);
    }

    .info-value {
      display: block;
      margin-top: 10px;
      font-size: 72px;
      line-height: 0.96;
      font-weight: 900;
      letter-spacing: -0.055em;
      color: #17181b;
      font-family: "Arial Black", "Avenir Next", "Segoe UI", sans-serif;
    }

    .info-row.date .info-value {
      font-size: 56px;
      letter-spacing: -0.04em;
    }

    .campus-panel {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 502px;
      height: 188px;
      border-top-left-radius: 124px;
      border-bottom-left-radius: 28px;
      border-top-right-radius: 22px;
      background: linear-gradient(180deg, rgba(125, 178, 237, 0.14), rgba(125, 178, 237, 0.05));
      border: 1px solid rgba(44, 75, 112, 0.08);
    }

    .illustration-wrap {
      position: absolute;
      right: -10px;
      bottom: -86px;
      width: 586px;
      height: 352px;
      z-index: 1;
      opacity: 0.92;
    }

    .illustration-glow {
      position: absolute;
      inset: 82px 24px 22px 130px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(114, 184, 240, 0.2), rgba(114, 184, 240, 0));
      filter: blur(8px);
    }

    .illustration-wrap svg {
      width: 100%;
      height: 100%;
    }

    .organizer-strip {
      position: absolute;
      left: 54px;
      right: 54px;
      bottom: 34px;
      height: 114px;
      border-radius: 30px;
      border: 2px solid rgba(53, 80, 116, 0.14);
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 18px 36px rgba(57, 86, 123, 0.08);
      display: grid;
      grid-template-columns: 156px repeat(4, 1fr);
      align-items: center;
      gap: 16px;
      padding: 0 24px;
    }

    .strip-label {
      font-size: 18px;
      line-height: 1.1;
      font-weight: 800;
      color: rgba(45, 72, 108, 0.68);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .logo-tile {
      height: 72px;
      border-radius: 20px;
      border: 1px solid rgba(50, 76, 112, 0.1);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(245, 248, 252, 0.92));
      display: grid;
      place-items: center;
      padding: 10px 18px;
    }

    .logo-tile img {
      display: block;
      max-width: 100%;
      max-height: 48px;
      object-fit: contain;
    }

    .logo-tile.circle img {
      max-height: 58px;
    }

    .logo-tile.ai img {
      max-height: 54px;
    }
  </style>
</head>
<body>
  <main class="poster">
    <div class="grain"></div>

    <section class="hero-band">
      <header class="campus-lockup">
        <div class="seal">WKU</div>
        <div class="campus-copy">
          <strong>Wenzhou-Kean University</strong>
          <small>CAMPUS HOST</small>
        </div>
      </header>

      <section class="title-cluster">
        <div class="top-pill"></div>

        <div class="grid-chip" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <article class="title-card">
          <div class="title-main">
            <span>Build</span>
            <span>with AI</span>
          </div>

          <svg class="spark-badge" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M60 8L104 34V86L60 112L16 86V34L60 8Z" fill="#5D88EE" stroke="#2B2B2E" stroke-width="4" />
            <path d="M60 28C64 43 77 56 92 60C77 64 64 77 60 92C56 77 43 64 28 60C43 56 56 43 60 28Z" fill="#FFFDF6" stroke="#2B2B2E" stroke-width="4" stroke-linejoin="round" />
          </svg>
        </article>

        <div class="mini-chip">
          <div class="gdg-mark" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <div class="year-chip">2026</div>
        <div class="accent-dot"></div>
        <div class="bottom-pill"></div>
      </section>

      <section class="info-panel">
        <p class="eyebrow">BUILD WITH AI - WENZHOU EDITION</p>

        <div class="info-frame">
          <div class="info-row">
            <span class="info-label">Location</span>
            <span class="info-value">Wenzhou-Kean University</span>
          </div>

          <div class="info-row date">
            <span class="info-label">Date</span>
            <span class="info-value">April 26, 2026</span>
          </div>
        </div>
      </section>

      <section class="illustration-wrap" aria-hidden="true">
        <div class="campus-panel"></div>
        <div class="illustration-glow"></div>
        <svg viewBox="0 0 650 420" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="towerFillV4" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stop-color="#6fa6e3" />

            </linearGradient>
            <linearGradient id="bodyFillV4" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="#7db2ed" />
              <stop offset="100%" stop-color="#396cae" />
            </linearGradient>
            <linearGradient id="shadowFillV4" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="#335d90" stop-opacity="0.16" />
              <stop offset="100%" stop-color="#335d90" stop-opacity="0.02" />
            </linearGradient>
          </defs>

          <g opacity="0.96" fill="none" stroke="#21486f" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
            <path d="M8 386C48 360 82 356 112 360C122 352 136 346 154 348C174 326 196 316 222 316C246 286 274 272 308 272C340 226 382 200 436 196C474 176 520 170 576 178C602 176 626 180 644 190V416H8Z" fill="url(#shadowFillV4)" stroke="none" />

            <g transform="translate(372 18)">
              <polygon points="66,0 110,56 22,56" fill="#4b7fc3" />

              <rect x="28" y="248" width="76" height="30" rx="8" fill="#4b7fc3" />
              <rect x="52" y="98" width="12" height="12" rx="2" fill="#c7def9" />
              <circle cx="66" cy="170" r="18" fill="#72aee6" />
              <line x1="66" y1="154" x2="66" y2="170" />
              <line x1="66" y1="170" x2="74" y2="162" />
              <path d="M50 86C56 64 76 64 82 86" fill="#e3f2ff" />
              <path d="M32 94C40 64 92 64 100 94" />

            </g>

            <g transform="translate(250 178)">
              <polygon points="12,90 120,0 228,90 228,204 12,204" fill="url(#bodyFillV4)" />
              <polygon points="120,0 228,90 120,110 12,90" fill="#4a7dc3" />

              <rect x="30" y="122" width="18" height="30" rx="2" fill="#274a75" />
              <rect x="62" y="122" width="18" height="30" rx="2" fill="#274a75" />
              <rect x="94" y="122" width="18" height="30" rx="2" fill="#274a75" />
              <rect x="140" y="122" width="18" height="62" rx="8" fill="#274a75" />

            <g transform="translate(478 226)">
              <polygon points="0,56 54,30 154,30 154,192 0,192" fill="#386aa9" />

              <rect x="110" y="86" width="16" height="18" rx="2" fill="#274a75" />

            <g transform="translate(164 254)">
              <path d="M26 150C26 82 30 54 38 18" />

              <path d="M46 54C60 58 72 68 84 82C70 76 58 78 46 86" fill="#3e6fad" />

            <g fill="#8ab7e6" stroke="#21486f">
              <ellipse cx="100" cy="382" rx="60" ry="24" />
              <ellipse cx="172" cy="386" rx="28" ry="20" />
              <ellipse cx="548" cy="394" rx="38" ry="26" />
              <ellipse cx="612" cy="390" rx="28" ry="18" />
            </g>

            <g fill="#6b9fd8">
              <circle cx="548" cy="328" r="34" />
              <circle cx="612" cy="316" r="24" />
            </g>
          </g>
        </svg>
      </section>
    </section>

    <section class="organizer-strip">
      <div class="strip-label">Organized by</div>

      <div class="logo-tile circle">
        <img src="assets/logo-reference/trimmed/2.png" alt="CSMT logo" />
      </div>

      <div class="logo-tile">
        <img src="assets/logo-reference/trimmed/3.png" alt="Google Developer Groups logo" />
      </div>

      <div class="logo-tile circle">
        <img src="assets/logo-reference/trimmed/4.png" alt="WRSIA logo" />
      </div>

      <div class="logo-tile ai">
        <img src="assets/logo-reference/trimmed/5.png" alt="AI Club logo" />
      </div>
    </section>
  </main>
</body>
</html>
