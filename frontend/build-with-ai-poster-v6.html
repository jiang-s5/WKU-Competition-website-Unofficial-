<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Build With AI Poster v4</title>
  <style>
    :root {
      --paper: #f5f3ed;
      --paper-soft: #fcfbf7;
      --ink: #1f2023;
      --line: #2c2e33;
      --blue: #4f7fe0;
      --blue-deep: #28568f;
      --blue-soft: #cae8fb;
      --blue-cloud: #d9efff;
      --sky: #72b5ea;
      --orange: #ffb20d;
      --orange-soft: #ffe9a0;
      --shadow: 0 22px 48px rgba(47, 72, 106, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 1600px;
      height: 1000px;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      position: relative;
    }

    .poster {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 10% 16%, rgba(114, 181, 234, 0.12), transparent 20%),
        radial-gradient(circle at 84% 74%, rgba(79, 127, 224, 0.12), transparent 22%),
        linear-gradient(180deg, #f7f5f0 0%, #f2f1eb 100%);
    }

    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.24;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(38, 65, 104, 0.035) 0 1px, transparent 1px),
        radial-gradient(circle at 70% 60%, rgba(38, 65, 104, 0.03) 0 1px, transparent 1px);
      background-size: 26px 26px, 32px 32px;
    }

    .hero-band {
      position: absolute;
      left: 54px;
      top: 56px;
      right: 54px;
      height: 742px;
      border-radius: 40px;
      border: 2px solid rgba(44, 46, 51, 0.1);
      overflow: hidden;
      box-shadow: 0 26px 56px rgba(56, 82, 122, 0.1);
      background:
        radial-gradient(circle at 84% 66%, rgba(114, 181, 234, 0.18), transparent 24%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.92) 0%, rgba(252, 250, 246, 0.95) 48%, rgba(242, 248, 253, 0.9) 100%);
    }

    .hero-band::before {
      content: "";
      position: absolute;
      inset: 28px;
      border-radius: 30px;
      border: 1px solid rgba(44, 46, 51, 0.06);
      pointer-events: none;
    }

    .hero-band::after {
      content: "";
      position: absolute;
      right: -70px;
      bottom: -40px;
      width: 560px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(96, 150, 219, 0.26), rgba(96, 150, 219, 0));
      filter: blur(10px);
      pointer-events: none;
    }

    .campus-lockup {
      position: absolute;
      top: 32px;
      right: 54px;
      display: flex;
      align-items: center;
      gap: 18px;
      color: #174780;
      z-index: 3;
    }

    .kean-seal {
      width: 86px;
      height: 86px;
      flex: none;
    }

    .campus-copy strong,
    .campus-copy small {
      display: block;
    }

    .campus-copy strong {
      font-size: 46px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.01em;
      font-family: "STSong", "Songti SC", "Noto Serif CJK SC", serif;
    }

    .campus-copy small {
      margin-top: 7px;
      font-size: 18px;
      line-height: 1.15;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: rgba(23, 71, 128, 0.86);
      font-family: Georgia, "Times New Roman", serif;
    }

    .title-cluster {
      position: absolute;
      left: 42px;
      top: 92px;
      width: 664px;
      height: 594px;
      z-index: 2;
    }

    .top-pill,
    .bottom-pill {
      position: absolute;
      border: 4px solid var(--line);
      border-radius: 999px;
      background: var(--orange);
      box-shadow: var(--shadow);
    }

    .top-pill {
      top: 0;
      left: 18px;
      width: 388px;
      height: 60px;
    }

    .bottom-pill {
      left: 332px;
      bottom: 0;
      width: 324px;
      height: 52px;
    }

    .grid-chip {
      position: absolute;
      top: -20px;
      left: 432px;
      width: 204px;
      height: 116px;
      border: 4px solid var(--line);
      border-radius: 30px;
      background: var(--blue-soft);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 16px 20px;
    }

    .grid-chip span {
      border-radius: 50%;
      border: 4px solid var(--line);
      background: linear-gradient(180deg, #5787ea 0%, #74b9f2 100%);
    }

    .title-card {
      position: absolute;
      inset: 52px 20px 104px 36px;
      border: 4px solid var(--line);
      border-radius: 42px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 22px 44px rgba(43, 43, 46, 0.07);
      padding: 78px 56px 60px;
    }

    .title-main {
      position: relative;
      z-index: 2;
      font-size: 100px;
      line-height: 0.92;
      font-weight: 900;
      letter-spacing: -0.065em;
      color: var(--ink);
      font-family: "Arial Black", "Avenir Next", "Segoe UI", sans-serif;
    }

    .title-main span {
      display: block;
    }

    .spark-badge {
      position: absolute;
      right: 84px;
      top: 88px;
      width: 110px;
      height: 110px;
    }

    .mini-chip,
    .year-chip {
      position: absolute;
      border: 4px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }

    .mini-chip {
      left: 146px;
      bottom: 104px;
      width: 202px;
      height: 112px;
      background: var(--orange-soft);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .year-chip {
      left: 340px;
      bottom: 104px;
      width: 212px;
      height: 112px;
      background: rgba(255, 255, 255, 0.95);
      display: grid;
      place-items: center;
      font-size: 54px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .accent-dot {
      position: absolute;
      right: 44px;
      bottom: 122px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 4px solid var(--line);
      background: var(--sky);
      box-shadow: var(--shadow);
    }

    .gdg-mark {
      position: relative;
      width: 96px;
      height: 62px;
    }

    .gdg-mark span {
      position: absolute;
      width: 46px;
      height: 24px;
      border-radius: 999px;
      border: 4px solid var(--line);
    }

    .gdg-mark span:nth-child(1) {
      left: 0;
      top: 0;
      background: #ef5548;
      transform: rotate(-34deg);
    }

    .gdg-mark span:nth-child(2) {
      right: 0;
      top: 0;
      background: #49b360;
      transform: rotate(34deg);
    }

    .gdg-mark span:nth-child(3) {
      left: 6px;
      bottom: 0;
      background: #3f78ef;
      transform: rotate(34deg);
    }

    .gdg-mark span:nth-child(4) {
      right: 6px;
      bottom: 0;
      background: #ffb407;
      transform: rotate(-34deg);
    }

    .info-panel {
      position: absolute;
      right: 108px;
      top: 182px;
      width: 548px;
      z-index: 3;
    }

    .eyebrow {
      margin: 0 0 20px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.22em;
      color: var(--blue-deep);
    }

    .info-frame {
      position: relative;
      padding: 38px 0 34px;
    }

    .info-frame::before,
    .info-frame::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--line);
    }

    .info-frame::before {
      top: 0;
    }

    .info-frame::after {
      bottom: 0;
    }

    .info-row + .info-row {
      margin-top: 34px;
    }

    .info-label {
      display: block;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(31, 32, 35, 0.54);
    }

    .info-value {
      display: block;
      margin-top: 10px;
      font-size: 72px;
      line-height: 0.96;
      font-weight: 900;
      letter-spacing: -0.055em;
      color: #17181b;
      font-family: "Arial Black", "Avenir Next", "Segoe UI", sans-serif;
    }

    .info-row.date .info-value {
      font-size: 56px;
      letter-spacing: -0.04em;
    }

    .campus-panel {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 502px;
      height: 188px;
      border-top-left-radius: 124px;
      border-bottom-left-radius: 28px;
      border-top-right-radius: 22px;
      background: linear-gradient(180deg, rgba(125, 178, 237, 0.14), rgba(125, 178, 237, 0.05));
      border: 1px solid rgba(44, 75, 112, 0.08);
    }

    .illustration-wrap {
      position: absolute;
      right: -10px;
      bottom: -114px;
      width: 572px;
      height: 344px;
      z-index: 1;
      opacity: 0.92;
    }

    .illustration-glow {
      position: absolute;
      inset: 82px 24px 22px 130px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(114, 184, 240, 0.2), rgba(114, 184, 240, 0));
      filter: blur(8px);
    }

    .illustration-wrap svg {
      width: 100%;
      height: 100%;
    }

    .organizer-strip {
      position: absolute;
      left: 54px;
      right: 54px;
      bottom: 24px;
      height: 166px;
      border-radius: 30px;
      border: 2px solid rgba(53, 80, 116, 0.14);
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 18px 36px rgba(57, 86, 123, 0.08);
      padding: 16px 20px 14px;
    }

    .partners-row {
      display: grid;
      grid-template-columns: 152px repeat(5, 1fr);
      align-items: center;
      gap: 14px;
    }

    .strip-label {
      color: rgba(45, 72, 108, 0.72);
    }

    .strip-label strong,
    .strip-label small {
      display: block;
    }

    .strip-label strong {
      font-size: 24px;
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .strip-label small {
      margin-top: 6px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .logo-tile {
      height: 60px;
      border-radius: 18px;
      border: 1px solid rgba(50, 76, 112, 0.1);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(245, 248, 252, 0.92));
      display: grid;
      place-items: center;
      padding: 8px 16px;
    }

    .logo-tile img,
    .logo-tile svg {
      display: block;
      max-width: 100%;
      max-height: 42px;
      object-fit: contain;
    }

    .logo-tile.circle img {
      max-height: 48px;
    }

    .logo-tile.ai img {
      max-height: 46px;
    }

    .logo-tile.whale svg {
      width: 92px;
      height: 40px;
    }

    .units-meta {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(53, 80, 116, 0.12);
      padding-left: 152px;
    }

    .unit-line {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 12px;
      line-height: 1.45;
      color: #244260;
    }

    .unit-line + .unit-line {
      margin-top: 4px;
    }

    .unit-line strong {
      flex: none;
      width: 58px;
      font-size: 12px;
      font-weight: 800;
      color: #1f528f;
      letter-spacing: 0.04em;
    }

    .unit-line span {
      flex: 1;
    }
  </style>
</head>
